services:
  - type: web
    name: resume-agent-mvp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "45"
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
      - key: SOFFICE_PATH
        value: /usr/bin/soffice
